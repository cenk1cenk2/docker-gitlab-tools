---
stages:
  - container
  - post

include:
  - project: devops/pipelines
    ref: buildah@1.2.2
    file: /buildah/build.gitlab-ci.yml
  - project: devops/pipelines
    ref: buildah@1.2.2
    file: /buildah/registry-dockerhub.gitlab-ci.yml
  - project: devops/pipelines
    ref: docker@1.1.0
    file: /docker/update-docker-hub-readme.gitlab-ci.yml

variables:
  CONTAINER_IMAGE_NAME: cenk1cenk2/gitlab-tools
  CONTAINER_FILE_CONTEXT: .
  CONTAINER_IMAGE_TAGS: latest
  README_SHORT_DESCRIPTION: |
    Runs Salamek/gitlab-tools in a container, which enables pull/push mirroring to Gitlab.

container-build:
  stage: container
  extends: .container-build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

update-docker-hub-readme:
  stage: post
  extends: .update-docker-hub-readme
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
