---
stages:
  - container
  - version
  - publish
  - post

include:
  - project: devops/pipelines
    ref: semantic-release@2.3.1
    file: /semantic-release/publish.gitlab-ci.yml
  - project: devops/pipelines
    ref: buildah@2.0.1
    file: /buildah/build.gitlab-ci.yml
  - project: devops/pipelines
    ref: buildah@2.0.1
    file: /buildah/registry-dockerhub.gitlab-ci.yml
  - project: devops/pipelines
    ref: docker@2.0.1
    file: /docker/update-docker-hub-readme.gitlab-ci.yml

variables:
  CONTAINER_IMAGE_NAME: cenk1cenk2/gitlab-tools
  CONTAINER_FILE_CONTEXT: .
  CONTAINER_IMAGE_TAGS: latest
  README_SHORT_DESCRIPTION: |
    Runs Salamek/gitlab-tools in a container, which enables pull/push mirroring to Gitlab.

container-build:
  stage: container
  extends: .container-build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

version:
  stage: version
  extends: .semantic-release
  needs:
    - container-build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never

publish:
  stage: publish
  variables:
    CONTAINER_IMAGE_TAGS: $CI_COMMIT_TAG
  extends: .container-build
  rules:
    - if: $CI_COMMIT_TAG

update-docker-hub-readme:
  stage: post
  extends: .update-docker-hub-readme
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
